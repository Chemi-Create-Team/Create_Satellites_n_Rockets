modLoader = "javafml"
loaderVersion = "[0,)"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "create"
type = "required"
versionRange = "[6.0.10,)"
ordering = "AFTER"
side = "BOTH"

# Rocket fuel is read from Create: Refinery 'n' Reactors' fluids when it is installed.
[[dependencies."${mod_id}"]]
modId = "create_refinery_n_reactors"
type = "optional"
versionRange = "[0.1.0,)"
ordering = "AFTER"
side = "BOTH"

# The ground console also shows up as an app of the Control Computer when it is installed.
[[dependencies."${mod_id}"]]
modId = "create_frontier_science"
type = "optional"
versionRange = "[0.3.32,)"
ordering = "AFTER"
side = "BOTH"
